<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive UI</title>
    <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.157.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen text-white overflow-x-hidden">
    <!-- UI Elements -->
    <div class="relative z-10 p-6">
        <nav class="glass rounded-lg p-4 mb-8">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">3D Experience</h1>
                <div class="space-x-4">
                    <button class="hover:text-blue-400 transition-colors" onclick="toggleShape('cube')">Cube</button>
                    <button class="hover:text-blue-400 transition-colors" onclick="toggleShape('sphere')">Sphere</button>
                    <button class="hover:text-blue-400 transition-colors" onclick="toggleShape('torus')">Torus</button>
                </div>
            </div>
        </nav>

        <div class="glass rounded-lg p-6 max-w-md">
            <h2 class="text-xl font-bold mb-4">Interactive Controls</h2>
            <div class="space-y-4">
                <div>
                    <label for="rotation" class="block mb-2">Rotation Speed</label>
                    <input type="range" id="rotation" min="0" max="0.1" step="0.001" value="0.01" 
                           class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <label for="color" class="block mb-2">Object Color</label>
                    <input type="color" id="color" value="#ffffff" 
                           class="w-full h-10 rounded cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Camera position
        camera.position.z = 5;

        // Shapes
        let currentShape;
        const geometries = {
            cube: new THREE.BoxGeometry(1, 1, 1),
            sphere: new THREE.SphereGeometry(0.7, 32, 32),
            torus: new THREE.TorusGeometry(0.7, 0.3, 16, 100)
        };

        function toggleShape(shapeName) {
            if (currentShape) scene.remove(currentShape);
            const geometry = geometries[shapeName];
            const material = new THREE.MeshPhongMaterial({ 
                color: document.getElementById('color').value,
                flatShading: true
            });
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
        }

        // Initial shape
        toggleShape('cube');

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            if (currentShape) {
                const speed = parseFloat(document.getElementById('rotation').value);
                currentShape.rotation.x += speed;
                currentShape.rotation.y += speed;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Color change handler
        document.getElementById('color').addEventListener('input', (e) => {
            if (currentShape) {
                currentShape.material.color.setStyle(e.target.value);
            }
        });

        // Responsive design
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
